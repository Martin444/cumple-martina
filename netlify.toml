# Netlify config para SvelteKit + adapter-netlify.
#
# El adapter ya produce el output correcto sin este archivo, pero declararlo
# explícito evita depender de la autodetección de Netlify y del publish dir.

[build]
  command = "npm run build"
  publish = ".netlify"

[build.environment]
  NODE_VERSION = "22"

# Variables de Firebase: son PÚBLICAS (van con prefijo PUBLIC_ y sin secreto).
# Configurarlas aquí para que el build de Netlive las tenga disponibles.
# Si también las tenés en el sitio de Netlify (Site settings → Environment variables),
# las de acá tienen prioridad sobre los valores centinela del .env.
#
PUBLIC_FIREBASE_API_KEY = "AIzaSyBfMr-R9fXJIhQ66AizNzKSjoeOQKzD-4o"
PUBLIC_FIREBASE_AUTH_DOMAIN = "cumple-marti.firebaseapp.com"
PUBLIC_FIREBASE_PROJECT_ID = "cumple-marti"
PUBLIC_FIREBASE_STORAGE_BUCKET = "cumple-marti.firebasestorage.app"
PUBLIC_FIREBASE_MESSAGING_SENDER_ID = "548754900385"
PUBLIC_FIREBASE_APP_ID = "1:548754900385:web:e5bba9b6f45d86131fb7e0"
